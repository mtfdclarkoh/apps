    <script>
// Presentation helpers included here so this admin page can be deployed independently.
window.MediUI = {
    escape(value = '') { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
    icon(name, cls = '') { return `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`; },
    status(value) { return value === 'Normal' ? 'normal' : value === 'Diversion' ? 'diversion' : 'unknown'; },
    time(value) { return value?.seconds ? new Date(value.seconds * 1000).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}) : 'Awaiting update'; },
    badge(value) { const type = this.status(value); return `<span class="badge ${type}">${this.icon(type === 'normal' ? 'check' : type === 'diversion' ? 'alert-triangle' : 'circle-help')}${this.escape(value || 'Unknown')}</span>`; },
    sidebar(active = 'board', connection = 'live') {
        const nav = (id, label, icon) => `<button onclick="setTab('${id}')" class="nav-item ${active === id ? 'active' : ''}" ${active === id ? 'aria-current="page"' : ''}>${this.icon(icon)}${label}</button>`;
        return `<aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">${this.icon('activity')}</span>MediTrack</a><p class="brand-sub">REGIONAL OPERATIONS</p><nav aria-label="Main navigation"><div class="nav-label">WORKSPACE</div><a class="nav-item ${active === 'board' ? 'active' : ''}" href="index.html" ${active === 'board' ? 'aria-current="page"' : ''}>${this.icon('layout-grid')}Status board</a>${active === 'board' ? `<a class="nav-item" href="admin.html">${this.icon('sliders-horizontal')}Management</a>` : `${nav('dashboard','Overview','sliders-horizontal')}${nav('history','History log','history')}${nav('settings','Hospital rules','settings-2')}<div class="nav-label">ADMIN TOOLS</div>${nav('simulator','Email simulator','mail')}${nav('debug','System logs','terminal')}${nav('guide','Setup guide','book-open')}`}</nav><div class="sidebar-bottom"><div class="connection ${connection}"><span class="dot"></span>${connection === 'live' ? 'Connected to live data' : connection === 'pending' ? 'Connecting to live data' : 'Connection interrupted'}</div><div class="sidebar-note">Regional hospital network<br>Hospital status monitoring</div></div></aside>`;
    },
    topbar(title, connection = 'live') { return `<header class="topbar"><div class="breadcrumb">Operations ${this.icon('chevron-right')}<strong>${title}</strong></div><div class="topbar-right"><span class="date">${new Date().toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',year:'numeric'})}</span><span class="live-pill ${connection}"><span class="dot"></span>${connection === 'live' ? 'Live updates' : connection === 'pending' ? 'Connecting' : 'Offline'}</span><span class="avatar">${this.icon('radio-tower')}</span></div></header>`; },
    stats(hospitals, pending = false) {
        const normal = hospitals.filter(h => h.status === 'Normal').length;
        const diversion = hospitals.filter(h => h.status === 'Diversion').length;
        return `<section class="stats" aria-label="Hospital status totals">${[['building-2','Hospitals tracked',hospitals.length,'','Regional network'],['circle-check','Normal status',normal,'normal','Operating normally'],['triangle-alert','On diversion',diversion,'diversion','Requires attention']].map(([icon,label,value,type,detail]) => `<div class="stat"><span class="stat-icon ${type}">${this.icon(icon)}</span><div><p class="stat-label">${label}</p><p class="stat-value">${pending ? '—' : value}</p></div><span class="stat-detail">${detail}</span></div>`).join('')}</section>`;
    },
    card(h, admin = false) {
        const type = this.status(h.status);
        return `<article class="hospital-card ${type}"><div class="card-main"><div class="card-top"><span class="hospital-icon">${this.icon('building-2')}</span>${this.badge(h.status)}${admin ? `<button class="delete-button" onclick="deleteHospital(decodeURIComponent('${encodeURIComponent(h.id).replace(/'/g, '%27')}'))" aria-label="Stop tracking ${this.escape(h.name)}" title="Stop tracking hospital">${this.icon('trash-2')}</button>` : ''}</div><h3>${this.escape(h.name)}</h3>${type === 'diversion' ? `<div class="reason"><span class="reason-label">Diversion reason</span>${this.escape(h.reason || 'No specific reason provided.')}</div>` : `<p class="status-description">${this.icon(type === 'normal' ? 'check' : 'circle-help')}${type === 'normal' ? 'Operating normally' : 'Status not confirmed'}</p>`}${h.comments ? `<p class="card-comment">${this.escape(h.comments)}</p>` : ''}</div><div class="card-footer">${this.icon('clock-3')}Updated<time>${this.time(h.lastUpdated)}</time></div></article>`;
    },
    activity(logs) { return `<div class="activity-panel"><div class="activity-list">${logs.length ? logs.map(l => `<article class="activity-item"><span class="activity-symbol ${this.status(l.newStatus)}">${this.icon(l.newStatus === 'Diversion' ? 'arrow-up-right' : l.newStatus === 'Normal' ? 'check' : 'circle-help')}</span><div><h3>${this.escape(l.hospitalName)}</h3><p>Status changed to <strong>${this.escape(l.newStatus)}</strong></p><time>${this.time(l.timestamp)}</time></div></article>`).join('') : '<p class="activity-empty">No recent status changes.<br>New updates will appear here.</p>'}</div></div>`; },
    empty(loading = false, error = null) { return `<div class="empty-state" role="status">${this.icon(error ? 'wifi-off' : loading ? 'loader-circle' : 'building-2', loading && !error ? 'spin' : '')}<h2>${error ? 'Unable to load hospital status' : loading ? 'Connecting to your network' : 'Your status board is ready'}</h2><p>${error ? 'Check your connection and try again. Current hospital status is unavailable.' : loading ? 'Waiting for the latest hospital updates…' : 'Hospitals will appear here as updates arrive.'}</p>${error ? '<button class="outline-button" onclick="location.reload()">Try again</button>' : !loading ? '<a class="outline-button" href="admin.html">Manage hospital rules</a>' : ''}</div>`; },
    footer() { return `<footer class="page-footer"><span>MediTrack <span aria-hidden="true">·</span> Regional hospital status</span><div class="legend"><span><i class="dot"></i>Normal</span><span><i class="dot" style="background:#bd4352"></i>Diversion</span><span><i class="dot" style="background:#81919a"></i>Unknown</span></div></footer>`; },
    icons() { window.lucide?.createIcons(); }
};

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp, addDoc, deleteDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const state = {
            user: null,
            activeTab: 'dashboard',
            hospitals: [],
            logs: [],
            systemLogs: [], 
            mappings: [], 
            loading: true,
            simText: '',
            error: null
        };

        import { firebaseConfig, appId } from './firebase-config.js'; 
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const adminEmail = 'mtfdclarkoh@gmail.com';
        let subscriptions = [];
        window.adminSignIn = async () => {
            state.error = null;
            try {
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account', login_hint: adminEmail });
                await signInWithPopup(auth, provider);
            } catch (error) {
                state.error = error.code === 'auth/operation-not-allowed'
                    ? 'Google sign-in must be enabled in Firebase Authentication.'
                    : error.code === 'auth/unauthorized-domain'
                    ? 'Add this website domain to Firebase Authentication authorized domains.'
                    : 'Sign-in failed: ' + error.message;
                state.loading = false;
                render();
            }
        };
        window.adminSignOut = () => signOut(auth);
        onAuthStateChanged(auth, (user) => {
            subscriptions.forEach(unsubscribe => unsubscribe());
            subscriptions = [];
            state.hospitals = []; state.logs = []; state.systemLogs = []; state.mappings = [];
            state.user = user && user.emailVerified && user.email === adminEmail
                && user.providerData.some(provider => provider.providerId === 'google.com') ? user : null;
            state.loading = Boolean(state.user);
            state.error = user && !user.isAnonymous && !state.user ? 'This Google account does not have administrator access.' : null;
            if (state.user) setupListeners();
            render();
        });

        function setupListeners() {
            subscriptions.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'hospitals'), (snapshot) => {
                state.hospitals = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                state.loading = false;
                state.error = null;
                render();
            }, handlePermissionError));

            const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'hospital_logs');
            subscriptions.push(onSnapshot(query(logsRef, orderBy('timestamp', 'desc'), limit(50)), (snapshot) => {
                state.logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            }, handlePermissionError));

            const sysLogsRef = collection(db, 'artifacts', appId, 'public', 'data', 'system_logs');
            subscriptions.push(onSnapshot(query(sysLogsRef, orderBy('timestamp', 'desc'), limit(50)), (snapshot) => {
                state.systemLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            }, handlePermissionError));

            const mapRef = collection(db, 'artifacts', appId, 'public', 'data', 'config_mappings');
            subscriptions.push(onSnapshot(mapRef, (snapshot) => {
                state.mappings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            }, handlePermissionError));
        }

        function handlePermissionError(error) {
            console.error(error);
            {
                state.error = error.code === 'permission-denied'
                    ? 'Access denied. Publish the hospital tracker Firestore rules and sign in with the administrator Google account.'
                    : 'Database connection failed: ' + error.message;
                state.loading = false;
                render();
            }
        }

        window.deleteHospital = async (id) => {
            if(!state.user) return;
            if(confirm('Stop tracking this hospital?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'hospitals', id));
            }
        };
        
        window.deleteMapping = async (id) => {
            if(!state.user) return;
            if(confirm('Remove this keyword rule?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config_mappings', id));
            }
        };

        window.addMapping = async () => {
             const keyword = document.getElementById('new-keyword').value.trim();
             const name = document.getElementById('new-name').value.trim();
             const addToDash = document.getElementById('add-to-dash').checked;

             if(!keyword || !name) return alert("Please enter both a keyword and a name");
             
             // 1. Create the rule
             await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'config_mappings'), {
                 keyword: keyword.toLowerCase(),
                 displayName: name,
                 timestamp: serverTimestamp()
             });

             // 2. Optionally create the dashboard card immediately
             if(addToDash) {
                 const hospitalId = name.toLowerCase().replace(/[^a-z0-9]/g, '-');
                 await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'hospitals', hospitalId), {
                    name: name,
                    status: 'Normal', // Default state
                    lastUpdated: serverTimestamp()
                 }, { merge: true });
             }

             document.getElementById('new-keyword').value = '';
             document.getElementById('new-name').value = '';
        };

        window.setTab = (tabName) => {
            state.activeTab = tabName;
            render();
        };

        window.setSimDraft = (text) => { state.simText = text; };

        window.setSimText = (text) => {
            state.simText = text;
            document.getElementById('sim-textarea').value = text;
        }

        window.processEmail = async () => {
            const text = document.getElementById('sim-textarea').value;
            if (!text || !state.user) return;
            const btn = document.getElementById('process-btn');
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing...`;
            lucide.createIcons();

            const lowerText = text.toLowerCase();
            let detectedStatus = 'Unknown';
            let hospitalName = 'Unknown Hospital';
            
            // Extract Reason and Comments
            let reason = '';
            let comments = '';
            const reasonMatch = text.match(/reasons?:\s*(.*?)(?:[\r\n]|$)/i);
            if(reasonMatch && reasonMatch[1]) reason = reasonMatch[1].trim().toUpperCase();
            
            const commentMatch = text.match(/(?:comments|comment):\s*(.*?)(?:[\r\n]|$)/i);
            if(commentMatch && commentMatch[1]) comments = commentMatch[1].trim().toUpperCase();

            // Status Logic
            if (lowerText.includes('to normal') || lowerText.includes('status: normal')) {
                detectedStatus = 'Normal';
            } else if (lowerText.includes('to limited divert') || lowerText.includes('to diversion') || lowerText.includes('to full') || lowerText.includes('to divert')) {
                detectedStatus = 'Diversion';
            } else if (lowerText.includes('diversion') || lowerText.includes('divert') || lowerText.includes('full capacity')) {
                detectedStatus = 'Diversion';
            } else if (lowerText.includes('normal') || lowerText.includes('open') || lowerText.includes('clear')) {
                detectedStatus = 'Normal';
            }

            if (detectedStatus === 'Normal') {
                reason = '';
                comments = '';
            }

            // --- NEW NAME LOGIC: USE 2ND LINE ---
            const lines = text.split('\n');
            let rawNameLine = '';
            // Arrays are 0-indexed, so index 1 is the 2nd line
            if (lines.length >= 2) {
                rawNameLine = lines[1].trim();
            }

            // Check if we have a mapping/rule for this line, otherwise use the line itself
            if (state.mappings.length > 0 && rawNameLine) {
                const found = state.mappings.find(m => rawNameLine.toLowerCase().includes(m.keyword.toLowerCase()));
                if (found) hospitalName = found.displayName;
                else hospitalName = rawNameLine;
            } else if (rawNameLine) {
                hospitalName = rawNameLine;
            } else {
                // Fallback if email is only 1 line long
                const commonNames = ['General Hospital', 'Memorial Medical Center', 'City Health', 'St. Marys', 'University Hospital'];
                const foundName = commonNames.find(n => lowerText.includes(n.toLowerCase()));
                if(foundName) hospitalName = foundName;
            }

            if (detectedStatus !== 'Unknown') {
                if(hospitalName === 'Unknown Hospital') hospitalName = "Unknown (Check Email Format)";
                
                const hospitalId = hospitalName.toLowerCase().replace(/[^a-z0-9]/g, '-');
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'hospitals', hospitalId), {
                        name: hospitalName,
                        status: detectedStatus,
                        reason: reason,     
                        comments: comments, 
                        lastUpdated: serverTimestamp()
                    }, { merge: true });
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'hospital_logs'), {
                        hospitalName, oldStatus: 'Unknown', newStatus: detectedStatus, timestamp: serverTimestamp(), rawText: text
                    });
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'system_logs'), {
                        message: `Simulator processed: ${hospitalName}`, type: 'success', timestamp: serverTimestamp()
                    });
                    state.simText = '';
                    if (document.getElementById('sim-textarea')) document.getElementById('sim-textarea').value = '';
                } catch (e) { alert("Write Error: " + e.message); }
            } else {
                alert("Could not detect status. Try using 'to normal' or 'to diversion'.");
            }
            btn.innerHTML = `<i data-lucide="mail" class="w-4 h-4"></i> Process Email`;
            lucide.createIcons();
        };

        function formatTime(timestamp) {
            if (!timestamp) return 'Just now';
            const date = new Date(timestamp.seconds * 1000);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }) + ' ' + date.toLocaleDateString();
        }

        function getStatusColor(status) {
            if (status === 'Normal') return 'bg-emerald-100 text-emerald-800 border-emerald-200';
            if (status === 'Diversion') return 'bg-rose-100 text-rose-800 border-rose-200';
            return 'bg-slate-100 text-slate-800 border-slate-200';
        }

        function renderDashboard() {
            const ui = window.MediUI;
            const hospitals = [...state.hospitals].sort((a, b) => (b.status === 'Diversion') - (a.status === 'Diversion') || a.name.localeCompare(b.name));
            return ui.stats(hospitals) + '<div class="section-heading"><h2>Hospital network <span class="count">' + hospitals.length + '</span></h2><span class="section-note">Diversions shown first</span></div><div class="hospital-grid admin-grid">' + (hospitals.length ? hospitals.map(h => ui.card(h, true)).join('') : ui.empty()) + '</div>';
        }

        function renderHistory() {
            return window.MediUI.activity(state.logs);
        }

        function renderDebug() {
            if (state.systemLogs.length === 0) return `<div class="p-8 text-center text-slate-500">No system logs yet.</div>`;
            return `<div class="space-y-4"><div class="bg-blue-50 border-l-4 border-blue-500 p-4 text-sm text-blue-700">Google Script Logs</div><div class="bg-slate-900 rounded-xl shadow-sm border border-slate-700 overflow-hidden text-slate-300 font-mono text-xs">${state.systemLogs.map(log => `
                <div class="p-3 border-b border-slate-700 flex gap-3 hover:bg-slate-800"><span class="text-slate-500 whitespace-nowrap">${formatTime(log.timestamp)}</span><span class="${log.type==='error'?'text-red-400':(log.type==='success'?'text-green-400':'text-blue-300')}">[${log.type?log.type.toUpperCase():'INFO'}]</span><span>${log.message}</span></div>`).join('')}</div></div>`;
        }
        
        function renderSettings() {
            return `
            <div class="max-w-4xl mx-auto space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-slate-800 mb-4">Add Rule</h3>
                    <div class="flex gap-4 items-end mb-4">
                        <div class="flex-1">
                            <input id="new-keyword" aria-label="Hospital keyword" type="text" placeholder="KEYWORD (e.g. methodist)" class="w-full p-2 border border-slate-300 rounded-lg">
                        </div>
                        <div class="flex-1">
                            <input id="new-name" aria-label="Hospital display name" type="text" placeholder="DISPLAY NAME" class="w-full p-2 border border-slate-300 rounded-lg">
                        </div>
                        <button onclick="addMapping()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">Add Rule</button>
                    </div>
                    <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer select-none">
                        <input type="checkbox" id="add-to-dash" checked class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 border-gray-300">
                        Also add to Dashboard immediately (Status: Normal)
                    </label>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="divide-y divide-slate-100">
                        ${state.mappings.map(m => `
                            <div class="p-3 flex items-center text-sm">
                                <div class="flex-1 font-mono bg-slate-100 rounded px-2 py-1 w-fit text-slate-700">${m.keyword}</div>
                                <div class="flex-1 font-semibold text-slate-900">${m.displayName}</div>
                                <div class="w-20">
                                    <button onclick="deleteMapping('${m.id}')" class="text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>`).join('')}
                    </div>
                </div>
            </div>`;
        }

        function renderSimulator() {
            return `<div class="max-w-2xl mx-auto space-y-6"><div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200"><textarea id="sim-textarea" aria-label="Status email content" oninput="setSimDraft(this.value)" class="w-full h-32 p-3 border border-slate-300 rounded-lg resize-none mb-4" placeholder="Alert Header\nMemorial Medical Center\nstatus from Limited Divert to Normal\nReasons: High Volume\nComments: ER is full">${window.MediUI.escape(state.simText)}</textarea><div class="flex justify-between items-center"><div class="space-x-2 text-xs"><button onclick="setSimText('Alert Header\\nMemorial Medical Center\\nstatus from Limited Divert to Normal')" class="text-indigo-600 hover:underline">Insert "To Normal"</button></div><button id="process-btn" onclick="processEmail()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-md transition-all"><i data-lucide="mail" class="w-4 h-4"></i> Process Email</button></div></div></div>`;
        }
        
        function renderGuide() { return `<div class="max-w-3xl mx-auto space-y-8"><div><h2 class="text-2xl font-bold text-slate-800 mb-4">Integration Guide</h2></div><div class="bg-slate-900 rounded-xl overflow-hidden p-6 text-slate-50 font-mono text-xs overflow-x-auto"><pre>Use Code.gs provided in chat.</pre></div></div>`; }

        function render() {
            if (!state.user) {
                document.getElementById('root').innerHTML = '<main style="max-width:480px;margin:12vh auto;padding:32px;background:white;border:1px solid #e4eaec;border-radius:12px"><h1>Hospital management</h1><p style="margin:18px 0">Sign in with mtfdclarkoh@gmail.com to manage hospital statuses and email rules.</p>' + (state.error ? '<p role="alert" style="color:#bd4352;margin-bottom:18px">' + window.MediUI.escape(state.error) + '</p>' : '') + '<button class="outline-button" onclick="adminSignIn()">Sign in with Google</button></main>';
                return;
            }

            const ui = window.MediUI;
            const views = {
                dashboard: ['Hospital overview', 'Manage the hospitals in your regional network.', renderDashboard],
                history: ['History log', 'A timeline of hospital status changes.', renderHistory],
                settings: ['Hospital rules', 'Match incoming hospital names to your status board.', renderSettings],
                debug: ['System logs', 'Review activity from your email integration.', renderDebug],
                simulator: ['Email simulator', 'Process a status email to update the hospital board.', renderSimulator],
                guide: ['Setup guide', 'Connect hospital notifications to MediTrack.', renderGuide]
            };
            const [title, description, content] = views[state.activeTab] || views.dashboard;
            const connection = state.error ? 'offline' : state.loading ? 'pending' : 'live';
            document.getElementById('root').innerHTML = `<div class="app-shell">${ui.sidebar(state.activeTab, connection)}<div class="workspace">${ui.topbar('Management', connection)}<main class="page-content"><div class="page-heading"><div><div class="eyebrow">Network management</div><h1>${title}</h1><p>${description}</p></div><button class="outline-button" onclick="adminSignOut()">Sign out</button><a class="outline-button" href="index.html">${ui.icon('arrow-up-right')}Open status board</a></div><div class="admin-body">${state.error || state.loading ? ui.empty(state.loading, state.error) : content()}</div>${ui.footer()}</main></div></div>`;
            ui.icons();
        }
        render();
    </script>
</head>
<body><div id="root"></div></body>
</html>
